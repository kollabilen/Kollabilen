<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kollabilen.se - AI Bilrapport</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; text-align: center; color: #38bdf8; }
        p.subtitle { color: #94a3b8; font-size: 14px; text-align: center; margin-bottom: 24px; line-height: 1.4; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; }
        input, select { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 16px; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 14px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #result { margin-top: 20px; }
        .report { background: #0f172a; padding: 16px; border-radius: 8px; border: 1px solid #334155; line-height: 1.6; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>kollabilen.se</h1>
        <p class="subtitle">Sök på registreringsnummer och få en direkt AI-analys inför ditt bilköp.</p>

        <form id="carForm">
            <label for="regInput">Registreringsnummer</label>
            <input type="text" id="regInput" placeholder="t.ex. ABC 123" required autocomplete="off">

            <label for="langSelect">Välj språk för rapporten</label>
            <select id="langSelect">
                <option value="Svenska">Svenska</option>
            </select>

            <button type="submit" id="searchBtn">Kolla Bilen</button>
        </form>

        <div id="result"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
