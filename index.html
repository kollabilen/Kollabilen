<!DOCTYPE html>
<html lang="sv" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kollabilen.se - AI Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b132b;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 450px; }
    .card {
      background: #1c2541;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    label { display: block; margin-top: 10px; font-size: 13px; color: #a0aec0; }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #3a506b;
      background: #0b132b;
      color: white;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #0077ff;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    #output {
      margin-top: 20px;
      padding: 15px;
      background: #0b132b;
      border-radius: 6px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>kollabilen.se (AI Test)</h2>

      <label>Märke:</label>
      <input type="text" id="brand" placeholder="t.ex. Volvo">

      <label>Modell & År:</label>
      <input type="text" id="model" placeholder="t.ex. XC60 2018">

      <label>Pris & Miltal:</label>
      <input type="text" id="details" placeholder="t.ex. 185 000 kr / 12 000 mil">

      <label>Välj Språk för rapporten:</label>
      <select id="language">
        <option value="Svenska">Svenska</option>
        <option value="Engelska">English</option>
        <option value="Arabiska">Arabiska</option>
      </select>

      <button id="searchBtn" onclick="testAiConnection()">Kontrollera bilen nu</button>

      <div id="output" style="display:none;"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
