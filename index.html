<!DOCTYPE html>
<html lang="sv" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Välkommen till vår webbplats</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
      color: #333;
    }
    header {
      background-color: #005293; /* Swedish Blue */
      color: #FECB00; /* Swedish Yellow */
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lang-selector {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn {
      background-color: #005293;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    .btn:hover {
      background-color: #003a68;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="header-title">Svensk Webbplats</h1>
    
    <!-- Väljare för språk (3 språk) -->
    <select id="languageSelect" class="lang-selector" onchange="changeLanguage(this.value)">
      <option value="sv" selected>Svenska (السويدية)</option>
      <option value="ar">العربية</option>
      <option value="en">English (الإنجليزية)</option>
    </select>
  </header>

  <div class="container">
    <h2 id="welcome-title">Välkommen till vår plattform</h2>
    <p id="description-text">
      Detta är en komplett mall skriven i svenska, med inbyggt stöd för tre olika språk.
    </p>
    <button class="btn" id="action-btn">Läs mer</button>
  </div>

  <script>
    // 1. Översättningsobjekt för tre språk (Svenska, Arabiska, Engelska)
    const translations = {
      sv: {
        pageTitle: "Välkommen till vår webbplats",
        headerTitle: "Svensk Webbplats",
        welcomeTitle: "Välkommen till vår plattform",
        descriptionText: "Detta är en komplett mall skriven i svenska, med inbyggt stöd för tre olika språk.",
        actionBtn: "Läs mer",
        dir: "ltr"
      },
      ar: {
        pageTitle: "مرحباً بك في موقعنا",
        headerTitle: "موقع سويدي",
        welcomeTitle: "مرحباً بك في منصتنا",
        descriptionText: "هذا قالب كامل مكتوب باللغة السويدية، مع دعم مدمج لثلاث لغات مختلفة.",
        actionBtn: "إقرأ المزيد",
        dir: "rtl"
      },
      en: {
        pageTitle: "Welcome to our website",
        headerTitle: "Swedish Website",
        welcomeTitle: "Welcome to our platform",
        descriptionText: "This is a complete template written in Swedish, with built-in support for three different languages.",
        actionBtn: "Read more",
        dir: "ltr"
      }
    };

    // 2. Funktion för att ändra språk och uppdatera gränssnittet
    function changeLanguage(lang) {
      const selectedLang = translations[lang];

      // Uppdatera texter i HTML
      document.getElementById('page-title').innerText = selectedLang.pageTitle;
      document.getElementById('header-title').innerText = selectedLang.headerTitle;
      document.getElementById('welcome-title').innerText = selectedLang.welcomeTitle;
      document.getElementById('description-text').innerText = selectedLang.descriptionText;
      document.getElementById('action-btn').innerText = selectedLang.actionBtn;

      // Uppdatera HTML-attribut (RTL för arabiska, LTR för svenska/engelska)
      document.documentElement.lang = lang;
      document.documentElement.dir = selectedLang.dir;
    }
  </script>

</body>
</html>
